name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches: [dev-aws]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          OXIDE_VER=$(node -e "console.log(require('./node_modules/@tailwindcss/oxide/package.json').version)")
          npm install --no-audit --no-fund --no-save @tailwindcss/oxide-linux-x64-gnu@$OXIDE_VER

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Upload hashed assets with long-term cache
          aws s3 sync dist/ s3://${{ secrets.DEV_S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # Upload HTML with no-cache so browsers always fetch the latest
          aws s3 cp dist/index.html s3://${{ secrets.DEV_S3_BUCKET_NAME }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
