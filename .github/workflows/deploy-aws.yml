name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches: [dev-aws]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        # SKIP_SNAP bypasses the react-snap prerender step, which needs Chromium.
        # CI=false keeps react-scripts from promoting lint warnings to build errors.
        env:
          SKIP_SNAP: 'true'
          CI: 'false'
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # CRA emits content-hashed filenames under build/static — safe to cache forever.
          aws s3 sync build/ s3://${{ secrets.DEV_S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "static/*"

          # Everything else (index.html, robots.txt, sitemap.xml, manifest.json,
          # images, Google site verification) keeps a stable name, so it must
          # revalidate or updates would be pinned in browser caches.
          aws s3 sync build/ s3://${{ secrets.DEV_S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "static/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
