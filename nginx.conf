server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    port_in_redirect off;

    # Canonicalize /index.html to root
    if ($request_uri = /index.html) { return 308 https://$host/; }

    # Vite hashed assets — safe to cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frame sequence for Services canvas player
    location /frames/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri /index.html;
    }
}
