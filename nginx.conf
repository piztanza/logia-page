server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Canonicalize duplicate HTML entry points
  location = /index.html { return 301 /; }
  location = /schedule.html { return 301 /schedule; }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}


