# Baseline Content-Security-Policy, defined once and reused across every
# response context below. The allowlist mirrors the origins the app actually
# uses (RF-009 / CA-007):
#   - script-src 'self'            : Vite emits hashed JS from /assets/ (no inline scripts)
#   - style-src  'unsafe-inline'   : 12 inline style={{…}} attributes rendered by React
#                + fonts.googleapis.com : Google Fonts stylesheet (@import in index.css)
#   - font-src   fonts.gstatic.com : Google Fonts webfont files
#   - img-src    'self' data:      : local PNG/WebP images + the inline SVG noise data URI
#   - media-src  'self'            : /background-cut2.mp4 hero video
#   - connect-src api.web3forms.com: contact-form POST (fetch)
# This is defined as a map (http context) so the long policy string lives in one
# place — nginx add_header does NOT inherit into a location that sets its own
# add_header, so the header must be re-declared in /assets/ and /frames/ below.
map $host $content_security_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://api.web3forms.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    port_in_redirect off;

    # Baseline security headers — cheap defense-in-depth for a public static site
    # that loads third-party fonts and POSTs the contact form to Web3Forms.
    # Inherited by `location /` (the SPA document); re-declared in the asset
    # locations below, which override header inheritance by setting Cache-Control.
    add_header Content-Security-Policy $content_security_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Canonicalize /index.html to root
    if ($request_uri = /index.html) { return 308 https://$host/; }

    # Vite hashed assets — safe to cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declare the security headers: a location-level add_header cancels
        # inheritance of the server-level ones.
        add_header Content-Security-Policy $content_security_policy always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Frame sequence for Services canvas player
    location /frames/ {
        expires 30d;
        add_header Cache-Control "public";
        # Re-declare the security headers: a location-level add_header cancels
        # inheritance of the server-level ones.
        add_header Content-Security-Policy $content_security_policy always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri /index.html;
    }
}
