server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    port_in_redirect off;

    # Canonicalize duplicate HTML entry points
    if ($request_uri = /index.html) { return 308 https://$host/; }
    if ($request_uri = /schedule.html) { return 308 https://$host/schedule; }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
