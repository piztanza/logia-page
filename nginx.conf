server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets aggressively (adjust as needed)
  location /assets/ {
    try_files $uri =404;
  }

  # SPA fallback: route non-file requests to index.html
  location / {
    try_files $uri /index.html;
  }
}


