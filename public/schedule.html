<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Schedule</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/images/LogoIcon-Logia.png" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body { height: 100%; margin: 0; background: #121826; color: #E5E7EB; font-family: Inter, sans-serif; }
      .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; width: 100%; background: rgba(15, 20, 25, 0.9); border-bottom: 1px solid #2a3444; backdrop-filter: saturate(150%) blur(8px); }
      .topbar-inner { max-width: 105rem; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; padding-left: 8px; }
      .brand { display: inline-flex; align-items: center; }
      .brand img { height: 160px; width: auto; display: block; }
      .back-link { display: inline-flex; align-items: center; gap: 8px; color: #E5E7EB; text-decoration: none; background: #3B82F6; border-radius: 8px; padding: 10px 16px; font-weight: 500; }
      .back-link:hover { background: #2563EB; }
      .container { min-height: 100%; display: flex; align-items: stretch; justify-content: center; padding: 208px 16px 16px; }
      iframe { width: 100%; max-width: 860px; border: 0; background: #0f1419; }
      .footer { border-top: 1px solid #2a3444; background: linear-gradient(to top, #0f1419, rgba(15,20,25,0)); padding: 48px 16px 64px; }
      .footer-inner { max-width: 80rem; margin: 0 auto; }
      .footer-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 32px; align-items: start; color: #E5E7EB; }
      .footer-title { font-family: Sora, sans-serif; font-weight: 600; font-size: 20px; color: #E5E7EB; margin-bottom: 8px; }
      .footer-text { color: #9CA3AF; font-size: 18px; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-inner">
        <a href="/index.html" class="brand" aria-label="Logia Initiative Home">
          <img src="/images/Logo-Logia.png" alt="Logia Initiative" />
        </a>
        <a class="back-link" href="/index.html" aria-label="Back to Home">
          <span style="display:inline-block;transform:translateY(-1px);">←</span>
          <span>Back to Home</span>
        </a>
      </div>
    </div>
    <div class="container">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfZJbdNbTiqpPJVKpOJb2M-ymR5bwZOYaLWYlrXVc_eB_upyw/viewform?embedded=true" width="640" height="4712" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-grid">
          <div style="display:flex;flex-direction:column;gap:8px;">
            <div class="footer-title" style="margin-bottom:0;">Address:</div>
            <div class="footer-text">South Tangerang, Indonesia</div>
            <div class="footer-text">info@logia-initiative.com</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <div class="footer-title" style="margin-bottom:0;">Contact:</div>
            <div class="footer-text">+62 813-1873-2870</div>
            <div class="footer-text">sales@logia-initiative.com</div>
          </div>
          <div style="display:flex;align-items:center;justify-self:end;">
            <a href="https://www.linkedin.com/company/logia-initiative/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <img src="/images/LinkedIn-Logo.png" alt="LinkedIn" style="height:40px;width:auto;" />
            </a>
          </div>
        </div>
        <div style="margin-top:24px;height:1px;background:#2a3444;"></div>
        <div style="color:#9CA3AF;font-size:14px;text-align:center;margin-top:16px;">© 2025 Logia Initiative</div>
      </div>
    </footer>
  </body>
  </html>
