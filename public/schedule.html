<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Schedule</title>
    <meta name="robots" content="noindex" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #121826;
        color: #E5E7EB;
        font-family: Inter, sans-serif;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        width: 100%;
        background: rgba(15, 20, 25, 0.9);
        border-bottom: 1px solid #2a3444;
        backdrop-filter: saturate(150%) blur(8px);
      }
      .topbar-inner {
        max-width: 80rem; /* matches max-w-7xl */
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
      }
      .brand {
        color: #E5E7EB;
        font-weight: 600;
        letter-spacing: .02em; /* same as headings in index.css */
        font-family: Sora, sans-serif;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #E5E7EB;
        text-decoration: none;
        background: #3B82F6;
        border-radius: 8px;
        padding: 10px 16px; /* closer to Button lg */
        font-weight: 500;
      }
      .back-link:hover { background: #2563EB; }
      .container {
        min-height: 100%;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 24px 16px 16px;
      }
      iframe {
        width: 100%;
        max-width: 860px;
        border: 0;
        background: #0f1419;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">Logia Initiative</div>
        <a class="back-link" href="/index.html" aria-label="Back to Home">
          <span style="display:inline-block;transform:translateY(-1px);">←</span>
          <span>Back to Home</span>
        </a>
      </div>
    </div>
    <div class="container">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfZJbdNbTiqpPJVKpOJb2M-ymR5bwZOYaLWYlrXVc_eB_upyw/viewform?embedded=true" width="640" height="4712" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>
  </body>
  </html>
